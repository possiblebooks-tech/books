      background: transparent;
      padding: 8px 16px;

      font-weight: 600;
      font-size: 0.95rem;
      color: var(--muted);
      cursor: pointer;
      transition: 0.18s;
    }
    .nav-btn:hover { background: #eef2ff; color: var(--blue); }
    .nav-btn.active { background: #eef2ff; color: var(--blue); font-weight: 700; }
    .nav-speak {
      background: var(--blue);
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;

      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

      border-radius: 50%;
      top: -120px; right: -80px;

      cursor: pointer;

      position: sticky;
      top: 96px;

      background: transparent;
      padding: 8px 12px;

    `;
    window.scrollTo(0,0);

    // highlight active bookmark on scroll
    const sideBtns = document.querySelectorAll('.side-btn');
    const headingsEls = headings.map(h => document.getElementById(h.id)).filter(Boolean);
    if (headingsEls.length > 0) {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const text = entry.target.textContent;
            sideBtns.forEach(btn => {
              btn.classList.toggle('active', btn.textContent === text);
            });
          }
        });
      }, { threshold: 0.3, rootMargin: '0px 0px -50px 0px' });
      headingsEls.forEach(el => observer.observe(el));
    }
  }

  // start
  home();
</script>
</body>
</html>
