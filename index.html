  </style>
</head>

    Science: {
      "Science In Human Activities And occupations": {
        "Keeping poultry and bees": `<h1>Poultry & Bees</h1><p>Rearing domestic birds and beekeeping.</p><h2 id="examples">Examples</h2><div class="formula">Chicken, Ducks, Turkeys, Honeybees</div><h2 id="products">Products</h2><div class="formula">Eggs, Meat, Feathers, Honey, Wax</div>`,
        "Crop Growing": `<h1>Crop Growing</h1><p>Agriculture and farming.</p>`,
        "Keeping sheep": `<h1>Keeping Sheep</h1><p>Rearing sheep for meat, wool, and milk.</p>

        <h3>TERMS USED IN SHEEP REARING</h3>
        <div class="formula">
          <strong>Ram:</strong> This is a mature male sheep.<br>
          <strong>Ewe:</strong> This is a mature female sheep.<br>
          <strong>Lamb:</strong> This is the young of a sheep.<br>
          <strong>Lambing:</strong> This is the act of giving birth in sheep.<br>

        <h3>REASONS FOR DOCKING (Importance of docking sheep)</h3>
        <div class="formula">

          • It provides skins to make leather products<br>

          • Sheep droppings<br>

        </div>

        <h3>EXTERNAL PARTS OF A SHEEP</h3>
        <div class="formula">
          External parts of a sheep include: head, neck, back, tail, udder, teats, hooves, horns, ears, eyes, nose, mouth, wool, etc.

        <h3>GROUPS OF SHEEP KEPT IN UGANDA</h3>

        <h3>LOCAL (INDIGENOUS/NATIVE) BREEDS OF SHEEP</h3>
        <div class="formula">
          All local breeds of sheep are kept for mutton production<br>

        <div class="formula">
          • Suffolk<br>

          • Texel<br>
          • Hampshire<br>
          • Merino<br>
          • Rambouillet<br>
          • Bluefaced Leicester<br>
          • Romney marsh
        </div>

        <h3>Exotic breeds of sheep kept for meat (mutton) production / mutton breeds of sheep</h3>
        <div class="formula">
          • Suffolk<br>
          • Dorset<br>
          • Southdown<br>
          • Cheviot<br>
          • Texel<br>
          • Hampshire
        </div>

        <h3>Exotic breeds of sheep kept for wool (fleece) production / wool breeds of sheep</h3>
        <div class="formula">
          • Merino<br>
          • Rambouillet<br>
          • Bluefaced Leicester<br>
          • Romney sheep

        <h3>Exotic breeds of sheep kept for both mutton and wool production / dual purpose breeds of sheep</h3>
        <div class="formula">
          • Corriedale sheep<br>

        </div>

        <h3>BREEDING IN SHEEP</h3>
        <div class="formula">
          • A ewe should be served at the age of 16 - 18 months<br>
          • The gestation period of sheep is 5 months (150 days).
        </div>

        <h3>FLUSHING</h3>
        <div class="formula">
          This is the providing of extra nutritious feeds to a ewe before mating
        </div>

        <h3>IMPORTANCE OF FLUSHING</h3>
        <div class="formula">
          • It stimulates ovulation (increases the rate of ovulation)<br>
          • It increases the chances of multiple births
        </div>

        <h3>STEAMING UP</h3>
        <div class="formula">
          This is the practice of feeding a pregnant animal on food rich in proteins
        </div>

        <h3>IMPORTANCE OF STEAMING UP</h3>
        <div class="formula">
          • It lengthens the next lactation period<br>
          • It increases colostrum<br>
          • It prevents low birth weight<br>
          • It enables the foetus to grow well<br>
          • It enables the pregnant animal to get strength for giving birth
        </div>

        <h3>WEANING</h3>
        <div class="formula">
          This is the gradual introduction of other foods to a baby to supplement breast milk<br>
          Weaning in sheep is done between 3 – 4 weeks.

          It is done using electric shears or hand shears<br>
          Electric shears remove wool faster than hand shears<br>
          Weaning sheep should be sheared at 8 months<br>
          A mature sheep should be sheared once a year

        </div>

        <h3>PARASITES (PESTS) IN FARM ANIMALS</h3>
        <div class="formula">
          A parasite is an organism that depends on a host for food and shelter<br>
          A host is an organism on which a parasite depends for food.
        </div>

        <h3>How do parasites benefit from their host for survival?</h3>
        <div class="formula">
          • They get food<br>
          • They get shelter
        </div>

        <h3>GROUPS (TYPES OR CLASSES) OF PARASITES</h3>
        <div class="formula">
          1. External Parasites (ectoparasites)<br>
          2. Internal Parasites (endoparasites)
        </div>

        <h3>EXTERNAL PARASITES</h3>
        <div class="formula">
          These are parasites that live outside the body of host
        </div>

        <h3>Examples of ectoparasites (external Parasites)</h3>
        <div class="formula">
          • Ticks<br>
          • Tsetse flies<br>
          • Mites
        </div>

          • By paddock grazing<br>
          • By deticking<br>

        </div>

        <h3>INTERNAL PARASITES</h3>
        <div class="formula">
          These are parasites that live inside the body of the host.<br>
          They live in muscles, intestines and liver
        </div>

        <h3>Examples of endoparasites (internal Parasites)</h3>
        <div class="formula">
          • Tape worms<br>
          • Hook worms<br>
          • Thread worms<br>
          • Liver flukes<br>
          • Ascaris worm
        </div>

        <h3>Control of endoparasites</h3>
        <div class="formula">
          • By deworming<br>
          • Giving animals clean feeds<br>
          • Regular cleaning of the houses for animals<br>
          • Regular cleaning of the feeding equipment for animals<br>
          • Grazing in well drained areas (to control liver flukes)
        </div>

        <h3>EFFECTS OF PARASITES (PESTS) OF CATTLE</h3>
        <div class="formula">
          • Some parasites suck blood which leads to anaemia<br>
          • Some parasites spread diseases to animals<br>
          • Some parasites damage the skins of animals<br>

      "Human Health": {
        "Primary Health Care": `<h1>Primary Health Care</h1><p>Essential health care for all.</p><h2 id="principles">Principles</h2><div class="formula">• Everyone must benefit<br>• Everyone participates</div><h2 id="elements">Elements</h2><div class="formula">Immunization, Family planning, Water and sanitation</div>`
      }
    }
  };

  const app = document.getElementById('app');

  function setActive(label) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.textContent === label));
  }

  // Speech synthesis control
  let currentUtterance = null;
  let isSpeaking = false;

  function readSelectedOrContent() {
    // Stop any ongoing speech
    stopReading();

    const sel = window.getSelection();
    let text = sel.toString().trim();
    if (text.length === 0) {
      const notesEl = document.getElementById('notes');
      if (notesEl) text = notesEl.innerText.trim();
      if (text.length === 0) text = document.body.innerText.trim();
    }
    if (text.length === 0) { alert('No text found to read.'); return; }

    currentUtterance = new SpeechSynthesisUtterance(text);
    currentUtterance.lang = 'en-US';
    currentUtterance.rate = 1.0;
    currentUtterance.pitch = 1.0;
    
    currentUtterance.onstart = function() {
      isSpeaking = true;
      document.getElementById('navSpeakBtn').textContent = '🔊 Reading...';
      document.getElementById('navSpeakBtn').style.opacity = '0.7';
    };
    
    currentUtterance.onend = function() {
      isSpeaking = false;
      document.getElementById('navSpeakBtn').textContent = '🔊 Read aloud';
      document.getElementById('navSpeakBtn').style.opacity = '1';
      currentUtterance = null;
    };
    
    currentUtterance.onerror = function() {
      isSpeaking = false;
      document.getElementById('navSpeakBtn').textContent = '🔊 Read aloud';
      document.getElementById('navSpeakBtn').style.opacity = '1';
      currentUtterance = null;
    };

    speechSynthesis.speak(currentUtterance);
  }

  function stopReading() {
    speechSynthesis.cancel();
    isSpeaking = false;
    currentUtterance = null;
    document.getElementById('navSpeakBtn').textContent = '🔊 Read aloud';
    document.getElementById('navSpeakBtn').style.opacity = '1';
  }

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('navSpeakBtn').addEventListener('click', function() {
      if (isSpeaking) {
        stopReading();
      } else {
        readSelectedOrContent();
      }
    });
    document.getElementById('navStopBtn').addEventListener('click', stopReading);
  });

  function animatedIcon(emoji) {
    return `<span class="icon-gif" style="display:flex; gap:2px; animation: pulseGlow 1.8s infinite alternate;">${emoji}</span>`;
  }
  const styleSheet = document.createElement("style");
  styleSheet.textContent = `
    @keyframes pulseGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(42,76,240,0.1)); }
      100% { transform: scale(1.08); filter: drop-shadow(0 0 12px rgba(42,76,240,0.25)); }
    }
  `;
  document.head.appendChild(styleSheet);

  function home() {
    setActive('Home');
    app.innerHTML = `
      <section class="hero">
        <span class="badge">📘 LEARN · PRACTICE · UNDERSTAND</span>
        <h1><span>Your subjects,</span> <span style="animation-delay:0.3s;">Properly organized.</span></h1>
        <p>ESSENTIALS gives you clear themes, useful topics, and complete notes. come explore the beauty of Mathematics and Science.</p>
        <p>
          <button class="btn btn-light" onclick="subjects('Science')"><span style="display:inline-block;animation:pulseGlow 2s infinite alternate;">🔬</span> Explore Science</button>
          <button class="btn btn-ghost" onclick="subjects('Mathematics')"><span style="display:inline-block;animation:pulseGlow 2s infinite alternate 0.2s;">📐</span> Explore Mathematics</button>
          <button class="btn btn-ghost" onclick="subjects('Questions')"><span style="display:inline-block;animation:pulseGlow 2s infinite alternate 0.4s;">📖</span> Explore Questions</button>
        </p>
      </section>
      <section class="section">
        <h2>Subjects</h2>
        <p class="muted">Choose a subject and start from its themes and topics.</p>
        <div class="grid">
          <article class="card" onclick="subjects('Science')">
            <div class="icon">${animatedIcon('🔬')}</div>
            <h3>Science</h3>
            <p class="muted">Human health and well-organized science notes.</p>
            <span class="go">Open Science →</span>
          </article>
          <article class="card" onclick="subjects('Questions')">
            <div class="icon">${animatedIcon('📖')}</div>
            <h3>Questions</h3>
            <p class="muted">Reading, comprehension and language.</p>
            <span class="go">Open Questions →</span>
          </article>
          <article class="card" onclick="subjects('Mathematics')">
            <div class="icon">${animatedIcon('📐')}</div>
            <h3>Mathematics</h3>
            <p class="muted">Numbers, algebra, geometry and measurement.</p>
            <span class="go">Open Mathematics →</span>
          </article>
        </div>
      </section>
    `;
    window.scrollTo(0,0);
  }

  function subjects(s) {
    setActive(s);
    const themes = Object.keys(D[s]);
    const iconMap = {
      'Science': { 'Science In Human Activities And occupations': '🧑‍🌾', 'Matter and Energy': '⚡', 'Managing changes in the environment': '🌍', 'Human Health': '❤️', 'the Environment': '🌿', 'Megadassssy': '📚' },
      'Mathematics': { 'Numeracy': '🔢', 'Algebra': '✖️', 'Measurement': '📏', 'Sets': '⊂', 'Interpretation of Graphs and Data': '📊' },
      'Questions': { 'Reading & Comprehension': '📖' }
    };
    const getIcon = (t) => (iconMap[s] && iconMap[s][t]) || '📘';
    app.innerHTML = `
      <button class="back-btn" onclick="home()">← Home</button>
      <section class="section">
        <h2>${s}</h2>
        <p class="muted">Choose a theme to see its topics.</p>
        <div class="grid">
          ${themes.map((t) => `
            <article class="card" onclick="theme('${s}','${t}')">
              <div class="icon">${animatedIcon(getIcon(t))}</div>
              <h3>${t}</h3>
              <p class="muted">${Object.keys(D[s][t]).length} topic(s)</p>
              <span class="go">View topics →</span>
            </article>
          `).join('')}
        </div>
      </section>
    `;
    window.scrollTo(0,0);
  }

  function theme(s, t) {
    const topics = Object.keys(D[s][t]);
    const topicIcons = {
      'Science': { 'Keeping poultry and bees': '🐓', 'Crop Growing': '🌾', 'Keeping sheep': '🐑', 'Keeping goats': '🐐', 'Keeping pigs': '🐖', 'Algebraic Expressions': '🧮', 'Linear Equations': '➗', 'Primary Health Care': '🏥', 'Perimeter and Area': '📏', 'Units of Measurement': '📐', 'Megadassssy': '📚' },
      'Mathematics': { 'Whole Numbers': '🔢', 'Fractions': '½', 'Decimals': '🔟', 'Ratios and proportion': '➗', 'Percentages': '%', 'Integers': '🔢', 'Finite/ Modular System': '🔄', 'Algebra': '✖️', 'Money': '💰', 'Distance speed and Time': '⏱️', 'Length, Mass and Capacity': '📏', 'Volume And Surface Area': '📦', 'set concepts': '⊂', 'Data Handling': '📊' },
      'Questions': { 'Fiction': '📖', 'Non-Fiction': '📰' }
    };
    const getIcon = (x) => (topicIcons[s] && topicIcons[s][x]) || '📌';
    app.innerHTML = `
      <button class="back-btn" onclick="subjects('${s}')">← ${s}</button>
      <section class="section">
        <p class="muted">${s} / ${t}</p>
        <h2>${t}</h2>
        <p class="muted">Click any topic to open complete notes.</p>
        <div class="grid">
          ${topics.map(x => `
            <article class="card" onclick="topic('${s}','${t}','${x}')">
              <div class="icon">${animatedIcon(getIcon(x))}</div>
              <h3>${x}</h3>
              <p class="muted">Clear notes, explanations and examples.</p>
              <span class="go">Read notes →</span>
            </article>
          `).join('')}
        </div>
      </section>
    `;
    window.scrollTo(0,0);
  }

  function topic(s, t, x) {
    const note = D[s][t][x];
    const safeName = x.replace(/[^a-zA-Z0-9 ]/g, '').trim().replace(/\s+/g, '_');
    const pdfSrc = `${safeName}.pdf`;
    const videoSrc = `${safeName}.mp4`;

    const pdfUrl = `${pdfSrc}#toolbar=0&navpanes=0&scrollbar=0`;

    app.innerHTML = `
      <button class="back-btn" onclick="theme('${s}','${t}')">← Back to topics</button>
      <div class="reader-layout">
        <article class="reader">
          <div class="crumb">${s} › ${t} › ${x}</div>
          
          <div id="notes">${note}</div>

          <div class="pdf-video-container" id="pdfContainer">
            <div class="media-label">
              <span>📄 Essentials</span>
              <button class="speak-embed-btn" onclick="toggleFullscreen('pdfContainer')">⛶ Fullscreen</button>
            </div>
            <embed src="${pdfUrl}" type="application/pdf" class="pdf-embed" style="overflow:hidden;" />
          </div>

          <div class="pdf-video-container">
            <div class="media-label">🎬 Video</div>
            <video controls class="video-embed" style="width:100%; height:340px; background:#0b0f1a;">
              <source src="${videoSrc}" type="video/mp4">
              <source src="${videoSrc.replace('.mp4', '.webm')}" type="video/webm">
              <source src="${videoSrc.replace('.mp4', '.ogg')}" type="video/ogg">
              <source src="${videoSrc.replace('.mp4', '.avi')}" type="video/avi">
              <source src="${videoSrc.replace('.mp4', '.mov')}" type="video/mov">
              <source src="${videoSrc.replace('.mp4', '.mkv')}" type="video/mkv">
              <source src="${videoSrc.replace('.mp4', '.flv')}" type="video/flv">
              <source src="${videoSrc.replace('.mp4', '.wmv')}" type="video/wmv">
              <source src="${videoSrc.replace('.mp4', '.m4v')}" type="video/m4v">
              Your browser does not support video.
            </video>
          </div>
        </article>
      </div>
    `;
    window.scrollTo(0,0);
  }

  function toggleFullscreen(elementId) {
    const elem = document.getElementById(elementId);
    
    if (!document.fullscreenElement) {
      if (elem.requestFullscreen) {
        elem.requestFullscreen();
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }
  }

  home();
</script>
</body>
</html>
